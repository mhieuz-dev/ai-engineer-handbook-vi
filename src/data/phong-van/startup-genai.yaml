id: startup-genai
ten: Startup GenAI
moTa: Code thực hành, thiết kế RAG/LLM, evaluation, hành vi. Quan tâm tốc độ và chi phí.
trongTam:
- RAG
- Evaluation
- Chi phí
- Agent
