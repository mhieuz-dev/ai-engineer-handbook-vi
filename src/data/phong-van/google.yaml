id: google
ten: Kiểu Google
moTa: Hai vòng code, ML system design, ML chuyên sâu, hành vi. Hỏi sâu vào dự án và nền tảng.
trongTam:
- Thuật toán
- Pipeline ML đầu cuối
- Attention
- Sâu dự án
vong:
- ten: Sàng lọc
  loai: hanh-vi
