so: 36
ten: Khoảng cách chỉnh sửa giữa hai từ
dang: quy-hoach-dong
muc: vua
de: Cho hai từ tiếng Việt đã tách âm tiết (mỗi âm tiết là một đơn vị). Tìm số thao tác chèn/xoá/thay ít
  nhất để biến từ này thành từ kia.
vi_du:
- vao: '"hoc", "hoc"'
  ra: '0'
- vao: '"hoc", "hoc_sinh"'
  ra: '5'
rang_buoc:
- 0 ≤ len(a), len(b) ≤ 500
khung: "def khoang_cach(a, b):\n    pass"
test_vi_du: 'assert khoang_cach("hoc", "hoc") == 0

  assert khoang_cach("", "abc") == 3

  assert khoang_cach("abc", "") == 3

  assert khoang_cach("abc", "yabd") == 2

  print("OK")'
test_an: 'import random, string

  rng = random.Random(17)

  a = "".join(rng.choice(string.ascii_lowercase) for _ in range(400))

  b = "".join(rng.choice(string.ascii_lowercase) for _ in range(400))

  assert isinstance(khoang_cach(a, b), int)

  print("OK")'
loi_giai: "def khoang_cach(a, b):\n    n, m = len(a), len(b)\n    truoc = list(range(m + 1))\n    for\
  \ i in range(1, n + 1):\n        hien = [i] + [0] * m\n        for j in range(1, m + 1):\n         \
  \   hien[j] = min(\n                truoc[j] + 1,\n                hien[j - 1] + 1,\n              \
  \  truoc[j - 1] + (a[i - 1] != b[j - 1]),\n            )\n        truoc = hien\n    return truoc[m]"
phuc_tap: O(n·m) thời gian, O(m) bộ nhớ.
goi_y:
- Bảng dp[i][j] cho tiền tố i, j.
- 'Ba lựa chọn: xoá, chèn, thay.'
- Chỉ cần hàng trước.
tuong_tu:
  ten: Edit Distance
  link: https://leetcode.com/problems/edit-distance/
vi_sao_dung: Thao tác cuối là xoá, chèn hoặc thay/giữ; mỗi trường hợp dẫn tới bài toán nhỏ hơn, nên công
  thức DP đúng và tối ưu con.
do_phuc_tap_chat: O(n·m) thời gian, O(m) bộ nhớ.
