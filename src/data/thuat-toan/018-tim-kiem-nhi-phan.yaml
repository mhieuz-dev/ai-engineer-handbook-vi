so: 18
ten: Chèn mã đơn vào đúng vị trí
dang: tim-kiem-nhi-phan
muc: de
de: Cho danh sách đã sắp và giá trị x. Trả về vị trí chèn để danh sách vẫn sắp (nếu đã có x thì trả vị
  trí đầu tiên của x).
vi_du:
- vao: '[1, 3, 5, 6], 5'
  ra: '2'
- vao: '[1, 3, 5, 6], 2'
  ra: '1'
rang_buoc:
- 0 ≤ len(ds) ≤ 100 000
khung: "def vi_tri_chen(ds, x):\n    pass"
test_vi_du: 'assert vi_tri_chen([1, 3, 5, 6], 5) == 2

  assert vi_tri_chen([1, 3, 5, 6], 2) == 1

  assert vi_tri_chen([1, 3], 4) == 2

  print("OK")'
test_an: 'ds = list(range(0, 200000, 2))

  assert vi_tri_chen(ds, 123457) == 61729

  print("OK")'
loi_giai: "def vi_tri_chen(ds, x):\n    lo, hi = 0, len(ds)\n    while lo < hi:\n        giua = (lo +\
  \ hi) // 2\n        if ds[giua] < x:\n            lo = giua + 1\n        else:\n            hi = giua\n\
  \    return lo"
phuc_tap: O(log n) thời gian.
goi_y:
- Tìm vị trí đầu tiên có giá trị ≥ x.
- Dùng khoảng [lo, hi).
- Trả lo.
tuong_tu:
  ten: Search Insert Position
  link: https://leetcode.com/problems/search-insert-position/
vi_sao_dung: 'Bất biến: mọi vị trí < lo có giá < x, mọi vị trí ≥ hi có giá ≥ x; khi lo=hi, lo là vị trí
  chèn đầu tiên.'
do_phuc_tap_chat: O(log n) thời gian.
