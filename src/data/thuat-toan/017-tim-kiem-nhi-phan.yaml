so: 17
ten: Tìm mã đơn trong danh sách đã sắp
dang: tim-kiem-nhi-phan
muc: de
de: Cho danh sách mã đơn đã sắp tăng và một mã cần tìm. Trả về chỉ số hoặc -1. Phải chạy trong O(log n).
vi_du:
- vao: '[1, 3, 5, 7], 5'
  ra: '2'
- vao: '[1, 3, 5], 4'
  ra: '-1'
rang_buoc:
- 0 ≤ len(ds) ≤ 100 000
khung: "def tim(ds, x):\n    pass"
test_vi_du: 'assert tim([1, 3, 5, 7], 5) == 2

  assert tim([1, 3, 5], 4) == -1

  print("OK")'
test_an: 'ds = list(range(0, 200000, 2))

  assert tim(ds, 123456) == 61728

  print("OK")'
loi_giai: "def tim(ds, x):\n    lo, hi = 0, len(ds) - 1\n    while lo <= hi:\n        giua = (lo + hi)\
  \ // 2\n        if ds[giua] == x:\n            return giua\n        if ds[giua] < x:\n            lo\
  \ = giua + 1\n        else:\n            hi = giua - 1\n    return -1"
phuc_tap: O(log n) thời gian.
goi_y:
- Dùng lo/hi và vòng while.
- So phần tử giữa.
- Thu hẹp nửa chứa x.
tuong_tu:
  ten: Binary Search
  link: https://leetcode.com/problems/binary-search/
vi_sao_dung: Mỗi bước thu hẹp khoảng còn một nửa; sau log₂n bước khoảng rỗng, nên tìm thấy hoặc kết luận
  không có trong O(log n).
do_phuc_tap_chat: O(log n) thời gian.
