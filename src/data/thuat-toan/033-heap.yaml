so: 33
ten: Phần tử lớn thứ k
dang: heap
muc: vua
de: Cho dãy số và `k`, trả về phần tử lớn thứ `k` (không phải thứ k khác nhau).
vi_du:
- vao: '[3,2,1,5,6,4], 2'
  ra: '5'
rang_buoc:
- 1 ≤ k ≤ len(ds) ≤ 100 000
khung: "import heapq\n\ndef lon_thu_k(ds, k):\n    pass"
test_vi_du: 'assert lon_thu_k([3,2,1,5,6,4], 2) == 5

  assert lon_thu_k([1], 1) == 1

  print("OK")'
test_an: 'import random

  rng = random.Random(15)

  ds = [rng.randint(-10**9, 10**9) for _ in range(100000)]

  assert lon_thu_k(ds, 50000) == sorted(ds, reverse=True)[49999]

  print("OK")'
loi_giai: "import heapq\ndef lon_thu_k(ds, k):\n    return heapq.nlargest(k, ds)[-1]"
phuc_tap: O(n log k) thời gian.
goi_y:
- Giữ heap k phần tử lớn nhất.
- Hoặc quickselect trung bình O(n).
- Đáp án là phần tử nhỏ nhất trong heap k.
tuong_tu:
  ten: Kth Largest Element in an Array
  link: https://leetcode.com/problems/kth-largest-element-in-an-array/
