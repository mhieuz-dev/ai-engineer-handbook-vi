so: 38
ten: Đổi tiền bằng ít xu nhất
dang: quy-hoach-dong
muc: vua
de: Cho các mệnh giá xu và số tiền cần đổi. Trả về số xu ít nhất, hoặc -1 nếu không đổi được.
vi_du:
- vao: '[1,2,5], 11'
  ra: '3'
rang_buoc:
- 1 ≤ số tiền ≤ 10 000
khung: "def doi_tien(xu, so_tien):\n    pass"
test_vi_du: 'assert doi_tien([1,2,5], 11) == 3

  assert doi_tien([2], 3) == -1

  print("OK")'
test_an: 'import random

  rng = random.Random(19)

  xu = [1] + sorted(rng.sample(range(2, 500), 20))

  assert isinstance(doi_tien(xu, 10000), int)

  print("OK")'
loi_giai: "def doi_tien(xu, so_tien):\n    vo_cuc = so_tien + 1\n    dp = [0] + [vo_cuc] * so_tien\n \
  \   for x in range(1, so_tien + 1):\n        for m in xu:\n            if m <= x:\n                dp[x]\
  \ = min(dp[x], dp[x - m] + 1)\n    return -1 if dp[so_tien] == vo_cuc else dp[so_tien]"
phuc_tap: O(so_tien · số mệnh giá) thời gian.
goi_y:
- dp[x] = số xu ít nhất cho x.
- Thử mọi mệnh giá ≤ x.
- Khởi tạo vô cực, trả -1 nếu không đổi được.
tuong_tu:
  ten: Coin Change
  link: https://leetcode.com/problems/coin-change/
