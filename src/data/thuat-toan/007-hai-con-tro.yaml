so: 7
ten: Xoá mã trùng trong danh sách đã sắp
dang: hai-con-tro
muc: de
de: Danh sách mã đơn đã sắp tăng. Xoá các mã trùng tại chỗ sao cho mỗi mã còn đúng một lần ở đầu danh
  sách; trả về số phần tử còn lại `n`. Phần sau `n` không cần quan tâm.
vi_du:
- vao: '[1, 1, 2]'
  ra: '2'
rang_buoc:
- 0 ≤ len(ds) ≤ 100 000
khung: "def xoa_trung(ds):\n    # trả về số phần tử còn lại, sửa ds tại chỗ\n    pass"
test_vi_du: 'ds = [1, 1, 2]

  n = xoa_trung(ds)

  assert n == 2 and ds[:n] == [1, 2]

  print("OK")'
test_an: 'ds = [1] * 50000 + [2] * 50000

  n = xoa_trung(ds)

  assert n == 2 and ds[:n] == [1, 2]

  print("OK")'
loi_giai: "def xoa_trung(ds):\n    if not ds:\n        return 0\n    n = 1\n    for i in range(1, len(ds)):\n\
  \        if ds[i] != ds[n - 1]:\n            ds[n] = ds[i]\n            n += 1\n    return n"
phuc_tap: O(n) thời gian, O(1) bộ nhớ phụ.
goi_y:
- Dùng một con trỏ ghi cho vị trí phần tử khác gần nhất.
- So với phần tử cuối đã ghi, không so với phần tử trước.
- Trả về độ dài mới.
tuong_tu:
  ten: Remove Duplicates from Sorted Array
  link: https://leetcode.com/problems/remove-duplicates-from-sorted-array/
