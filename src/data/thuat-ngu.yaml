- id: dao-ham
  ten: Đạo hàm
  tenTiengAnh: derivative
  giaiThich: Đạo hàm cho biết một đại lượng đổi nhanh hay chậm khi nhích đầu vào một chút. Dương là đang lên dốc, âm là đang xuống dốc. Nhờ dấu của nó, ta biết nên tăng hay giảm đầu vào.
  hocKy: ai-engineer/ch06-giai-tich
- id: dao-ham-rieng
  ten: Đạo hàm riêng
  tenTiengAnh: partial derivative
  giaiThich: Khi hàm có nhiều đầu vào, ta chỉ nhích một đầu vào và giữ nguyên các đầu vào còn lại. Độ đổi của đầu ra theo riêng đầu vào đó gọi là đạo hàm riêng.
  hocKy: ai-engineer/ch06-giai-tich
- id: gradient
  ten: Gradient
  tenTiengAnh: gradient
  giaiThich: Gradient là một danh sách các đạo hàm riêng, mỗi đầu vào một số. Nó chỉ hướng dốc lên nhanh nhất, như mũi tên chỉ lên đỉnh đồi. Đi ngược hướng đó là cách xuống dốc nhanh nhất.
  hocKy: ai-engineer/ch06-giai-tich
- id: learning-rate
  ten: Learning rate
  tenTiengAnh: learning rate
  giaiThich: Learning rate là độ dài mỗi bước khi xuống dốc. Bước quá nhỏ thì đi rất lâu, bước quá lớn thì nhảy qua đáy. Người huấn luyện tự chọn con số này trước khi chạy.
  hocKy: ai-engineer/ch08-toi-uu-hoa
- id: mse
  ten: MSE
  tenTiengAnh: mean squared error
  giaiThich: MSE là trung bình của bình phương độ lệch giữa dự đoán và giá trị thật. Bình phương làm sai số lớn bị phạt nặng hơn sai số nhỏ. Đây là hàm mất mát quen thuộc nhất khi mô hình phải đoán ra một con số.
  hocKy: ai-engineer/ch10-hoi-quy-tuyen-tinh
- id: phan-du
  ten: Phần dư
  tenTiengAnh: residual
  giaiThich: Phần dư là chênh lệch giữa giá trị thật và giá trị mô hình dự đoán cho từng điểm dữ liệu. Nó cho thấy mô hình lệch bao nhiêu ở điểm đó. Nhìn mọi phần dư cùng lúc sẽ biết mô hình khớp dữ liệu tốt hay chưa.
  hocKy: ai-engineer/ch10-hoi-quy-tuyen-tinh
- id: ham-mat-mat
  ten: Hàm mất mát
  tenTiengAnh: loss function
  giaiThich: Hàm mất mát là một con số đo mô hình đang sai nhiều hay ít. Con số càng nhỏ thì mô hình càng đúng. Huấn luyện nghĩa là chỉnh tham số để con số này nhỏ đi.
  hocKy: ai-engineer/ch10-hoi-quy-tuyen-tinh
- id: gradient-descent
  ten: Gradient descent
  tenTiengAnh: gradient descent
  giaiThich: Gradient descent là cách xuống đáy bằng nhiều bước nhỏ, như xuống dốc trong sương mù, mỗi bước theo hướng dốc xuống. Sau mỗi bước ta tính lại hướng rồi đi tiếp. Phần lớn mô hình học máy, kể cả mạng nơ-ron, học theo cách này.
  hocKy: ai-engineer/ch08-toi-uu-hoa
- id: chuan-hoa
  ten: Chuẩn hóa
  tenTiengAnh: feature scaling, standardization
  giaiThich: Chuẩn hóa đưa các cột dữ liệu về cùng một thang đo, thường là trung bình 0 và độ lệch chuẩn 1. Nhờ vậy cột có số lớn không lấn át cột có số nhỏ. Gradient descent cũng nhờ đó đi thẳng xuống đáy hơn, ít zích zắc.
  hocKy: ai-engineer/ch14-knn
- id: r-binh-phuong
  ten: R bình phương
  tenTiengAnh: R-squared, coefficient of determination
  giaiThich: R bình phương cho biết mô hình giải thích được bao nhiêu phần của độ biến thiên trong dữ liệu. Bằng 1 là khớp hoàn toàn, bằng 0 là không hơn gì việc đoán mức trung bình. Nó hay dùng để chấm điểm mô hình hồi quy.
  hocKy: ai-engineer/ch10-hoi-quy-tuyen-tinh
- id: outlier
  ten: Outlier
  tenTiengAnh: outlier
  giaiThich: Outlier là điểm dữ liệu nằm rất xa phần còn lại, như một người cao 2,5 m giữa lớp học. Một điểm như vậy có thể kéo cả mô hình lệch theo. Gặp outlier, cần tìm hiểu vì sao nó lạ rồi mới quyết định giữ hay bỏ.
  hocKy: ai-engineer/ch10-hoi-quy-tuyen-tinh
- id: vector-hoa
  ten: Vector hóa
  tenTiengAnh: vectorization
  giaiThich: Vector hóa là viết phép tính cho cả mảng một lần thay vì lặp từng phần tử bằng vòng for. Như chấm cả xấp bài bằng một động tác thay vì từng tờ. Thư viện như NumPy làm việc đó nhanh hơn vòng for nhiều lần.
  hocKy: ai-engineer/ch03-numpy
- id: nghiem-dong
  ten: Nghiệm đóng
  tenTiengAnh: closed-form solution
  giaiThich: Nghiệm đóng là công thức cho ra đáp án ngay, không cần lặp nhiều bước. Hồi quy tuyến tính có nghiệm đóng. Phần lớn mô hình khác thì không, nên phải học bằng cách lặp từng bước.
  hocKy: ai-engineer/ch10-hoi-quy-tuyen-tinh
- id: hoi-quy-tuyen-tinh
  ten: Hồi quy tuyến tính
  tenTiengAnh: linear regression
  giaiThich: Hồi quy tuyến tính là cách tìm một đường thẳng đi gần nhất với các điểm dữ liệu, để từ một con số đoán ra một con số khác. Nó là viên gạch đầu tiên của mạng nơ-ron. Với một đặc trưng, đường thẳng có dạng ŷ = wx + b.
  hocKy: ai-engineer/ch10-hoi-quy-tuyen-tinh
- id: tham-so
  ten: Tham số
  tenTiengAnh: parameter
  giaiThich: Tham số là những con số bên trong mô hình mà máy tự chỉnh trong lúc học, như những núm vặn. Học xong, mô hình chỉ là các tham số đã vặn đúng chỗ.
  hocKy: ai-engineer/ch09-quy-trinh-du-an-ml
- id: dac-trung
  ten: Đặc trưng
  tenTiengAnh: feature
  giaiThich: Đặc trưng là một thông tin đầu vào mà mô hình dùng để đoán, như một cột trong bảng dữ liệu. Một bài toán có thể có một hay hàng nghìn đặc trưng.
  hocKy: ai-engineer/ch09-quy-trinh-du-an-ml
- id: quy-tac-chuoi
  ten: Quy tắc chuỗi
  tenTiengAnh: chain rule
  giaiThich: Quy tắc chuỗi dùng để lấy đạo hàm của một hàm lồng trong hàm khác. Đạo hàm lớp ngoài nhân với đạo hàm lớp trong. Mạng nơ-ron tính gradient bằng cách dùng quy tắc này qua từng lớp.
  hocKy: ai-engineer/ch06-giai-tich
- id: tri-rieng
  ten: Trị riêng
  tenTiengAnh: eigenvalue
  giaiThich: Trị riêng của một ma trận cho biết ma trận đó kéo giãn mạnh bao nhiêu theo từng hướng đặc biệt của nó. Hướng có trị riêng lớn là hướng bị kéo mạnh nhất.
  hocKy: ai-engineer/ch05-dai-so-tuyen-tinh
- id: hop-ly-cuc-dai
  ten: Ước lượng hợp lý cực đại
  tenTiengAnh: maximum likelihood estimation
  giaiThich: Ước lượng hợp lý cực đại là chọn tham số sao cho dữ liệu đã thấy có xác suất xảy ra cao nhất. Nó là lý do sâu xa của nhiều hàm mất mát quen thuộc.
  hocKy: ai-engineer/ch07-xac-suat-thong-ke
- id: mae
  ten: MAE
  tenTiengAnh: mean absolute error
  giaiThich: MAE là trung bình của trị tuyệt đối độ lệch giữa dự đoán và giá trị thật. Nó không bình phương nên ít bị một điểm lệch xa kéo đi. Vì vậy MAE hay được dùng thay MSE khi dữ liệu có outlier.
  hocKy: ai-engineer/ch12-danh-gia-mo-hinh
- id: thang-log
  ten: Thang log
  tenTiengAnh: logarithmic scale
  giaiThich: Thang log là trục mà mỗi vạch lớn gấp 10 lần vạch ngay dưới, thay vì cộng thêm một khoảng đều. Nhờ vậy số rất nhỏ và số rất lớn cùng nằm vừa một hình.
  hocKy: ai-engineer/ch04-pandas-va-matplotlib
- id: tuong-quan
  ten: Tương quan
  tenTiengAnh: correlation
  giaiThich: Tương quan là hai đại lượng hay đi cùng nhau, cái này lớn thì cái kia cũng hay lớn (hoặc hay nhỏ). Tương quan không có nghĩa cái này gây ra cái kia.
  hocKy: ai-engineer/ch07-xac-suat-thong-ke
- id: mo-hinh
  ten: Mô hình
  tenTiengAnh: model
  giaiThich: Mô hình là một công thức nhận dữ liệu đầu vào rồi trả ra một con số đoán hay một lựa chọn. Bên trong nó có các tham số mà máy tự chỉnh khi học. Đường thẳng ŷ = wx + b là một trong những mô hình đơn giản nhất.
  hocKy: ai-engineer/ch09-quy-trinh-du-an-ml
- id: du-lieu-huan-luyen
  ten: Dữ liệu huấn luyện
  tenTiengAnh: training data
  giaiThich: Dữ liệu huấn luyện là bộ ví dụ có sẵn đáp án để mô hình nhìn vào mà học, như xấp đề có lời giải. Huấn luyện (training) là chỉnh tham số cho mô hình đoán khớp các ví dụ đó. Mô hình tốt phải đoán đúng cả dữ liệu mới, không chỉ dữ liệu đã học.
  hocKy: ai-engineer/ch09-quy-trinh-du-an-ml
- id: nhan
  ten: Nhãn
  tenTiengAnh: label
  giaiThich: Nhãn là đáp án đúng đi kèm mỗi ví dụ, thứ mô hình phải học cách đoán ra. Nó còn được gọi là biến mục tiêu (target). Trong bảng dữ liệu, nhãn là cột cần dự đoán.
  hocKy: ai-engineer/ch09-quy-trinh-du-an-ml
- id: trong-so
  ten: Trọng số
  tenTiengAnh: weight
  giaiThich: Trọng số là con số cho biết một đầu vào được coi nặng hay nhẹ khi mô hình tính kết quả. Đầu vào nhân với trọng số lớn thì ảnh hưởng nhiều. Mạng nơ-ron có thể có hàng tỷ trọng số, tất cả được chỉnh trong lúc học.
  hocKy: ai-engineer/ch10-hoi-quy-tuyen-tinh
- id: he-so-chan
  ten: Hệ số chặn
  tenTiengAnh: bias, intercept
  giaiThich: Hệ số chặn là con số cộng thêm vào kết quả, không nhân với đầu vào nào. Nó nâng hay hạ cả đường thẳng mà không đổi độ nghiêng, như chỉnh độ cao một cái kệ. Trong mạng nơ-ron, nó thường được gọi là bias.
  hocKy: ai-engineer/ch10-hoi-quy-tuyen-tinh
- id: hoi-tu
  ten: Hội tụ
  tenTiengAnh: convergence
  giaiThich: Hội tụ là khi các bước lặp tiến sát dần một điểm rồi gần như đứng yên ở đó, như hòn bi lăn rồi nằm im dưới đáy chén. Ngược lại, càng lặp càng đi xa và loss tăng vọt gọi là phân kỳ (divergence). Learning rate quá lớn là lý do phân kỳ hay gặp nhất.
  hocKy: ai-engineer/ch08-toi-uu-hoa
- id: do-thi-phan-du
  ten: Đồ thị phần dư
  tenTiengAnh: residual plot
  giaiThich: Đồ thị phần dư vẽ phần dư của từng điểm theo giá trị mô hình đoán. Mô hình hợp với dữ liệu thì các chấm rải đều quanh vạch 0, không có hình thù gì. Thấy hình chữ U hay hình phễu là dấu hiệu mô hình sai dạng.
  hocKy: ai-engineer/ch10-hoi-quy-tuyen-tinh
- id: bien
  ten: Biến
  tenTiengAnh: variable
  giaiThich: Biến là một cái tên gắn vào một giá trị, như dán nhãn lên chiếc hộp. Viết tên đó ở đâu thì Python lấy giá trị trong hộp ra dùng ở đó. Gán giá trị mới thì nhãn chuyển sang hộp mới.
  hocKy: ai-engineer/ch01-python-tu-dau
- id: kieu-du-lieu
  ten: Kiểu dữ liệu
  tenTiengAnh: data type
  giaiThich: Kiểu dữ liệu cho biết một giá trị thuộc loại nào, ví dụ số nguyên, số thực, chuỗi chữ hay đúng sai. Kiểu quyết định phép tính nào làm được với giá trị đó.
  hocKy: ai-engineer/ch01-python-tu-dau
- id: vong-lap
  ten: Vòng lặp
  tenTiengAnh: loop
  giaiThich: Vòng lặp là cách bảo máy làm lại một khối lệnh nhiều lần, mỗi lần với một giá trị khác hoặc cho tới khi một điều kiện hết đúng. Huấn luyện mô hình chính là một vòng lặp chạy hàng trăm tới hàng triệu lần.
  hocKy: ai-engineer/ch01-python-tu-dau
- id: ham
  ten: Hàm
  tenTiengAnh: function
  giaiThich: Hàm là một đoạn code được đặt tên, nhận đầu vào và trả về kết quả. Viết một lần rồi gọi lại bao nhiêu lần cũng được, như một chiếc máy xay chỉ cần bỏ nguyên liệu vào.
  hocKy: ai-engineer/ch01-python-tu-dau
- id: list
  ten: List
  tenTiengAnh: list
  giaiThich: List là một dãy giá trị có thứ tự, đánh số từ 0. Thêm, bớt, sửa phần tử đều được. Đây là cách đơn giản nhất để giữ cả cột dữ liệu trong Python thuần.
  hocKy: ai-engineer/ch01-python-tu-dau
- id: dict
  ten: Dict
  tenTiengAnh: dictionary
  giaiThich: Dict lưu các cặp khóa và giá trị, tra theo khóa thay vì theo số thứ tự. Giống một cuốn danh bạ, tra tên ra số điện thoại.
  hocKy: ai-engineer/ch01-python-tu-dau
- id: module
  ten: Module
  tenTiengAnh: module
  giaiThich: Module là một file code Python người khác đã viết sẵn, gồm nhiều hàm và biến. Gõ import tên module là mượn được toàn bộ những thứ trong đó. NumPy, pandas, PyTorch đều là module.
  hocKy: ai-engineer/ch02-python-cho-du-lieu
- id: csv
  ten: CSV
  tenTiengAnh: comma-separated values
  giaiThich: CSV là file chữ lưu một bảng, mỗi dòng là một hàng, các ô cách nhau bằng dấu phẩy. Mở được bằng Excel lẫn bằng code, nên là định dạng dữ liệu phổ biến nhất khi bắt đầu một dự án ML.
  hocKy: ai-engineer/ch02-python-cho-du-lieu
- id: ngoai-le
  ten: Ngoại lệ
  tenTiengAnh: exception
  giaiThich: Ngoại lệ là tín hiệu Python phát ra khi gặp chuyện không làm được, ví dụ đổi chữ abc thành số. Không bắt thì chương trình dừng. Bắt bằng try và except thì chương trình xử lý rồi chạy tiếp.
  hocKy: ai-engineer/ch02-python-cho-du-lieu
- id: lop
  ten: Lớp
  tenTiengAnh: class
  giaiThich: Lớp là khuôn để tạo ra các đối tượng cùng loại, mỗi đối tượng giữ dữ liệu riêng và có chung các hàm. Mọi mô hình trong scikit-learn và PyTorch đều là một lớp.
  hocKy: ai-engineer/ch02-python-cho-du-lieu
- id: mang
  ten: Mảng NumPy
  tenTiengAnh: array
  giaiThich: Mảng NumPy là một khối số cùng kiểu xếp theo hàng và cột, có thể một chiều, hai chiều hay nhiều chiều hơn. Phép tính trên mảng chạy cho mọi phần tử cùng lúc, nhanh hơn vòng lặp Python hàng chục lần.
  hocKy: ai-engineer/ch03-numpy
- id: shape
  ten: Shape
  tenTiengAnh: shape
  giaiThich: Shape là hình dạng của mảng, viết thành một tuple số phần tử theo từng chiều. Mảng 4 hàng 2 cột có shape (4, 2). Phần lớn lỗi khi viết code ML là lỗi shape không khớp.
  hocKy: ai-engineer/ch03-numpy
- id: broadcasting
  ten: Broadcasting
  tenTiengAnh: broadcasting
  giaiThich: Broadcasting là luật NumPy tự kéo giãn mảng nhỏ cho bằng mảng lớn khi tính, mà không chép dữ liệu ra thật. Nhờ nó, cộng một số hay một hàng vào cả bảng chỉ cần một phép tính.
  hocKy: ai-engineer/ch03-numpy
- id: truc
  ten: Trục
  tenTiengAnh: axis
  giaiThich: Trục là một chiều của mảng. Với bảng hai chiều, trục 0 đi dọc theo các hàng, trục 1 đi ngang theo các cột. Tính tổng theo trục nào thì trục đó bị gộp lại và biến mất.
  hocKy: ai-engineer/ch03-numpy
- id: dataframe
  ten: DataFrame
  tenTiengAnh: DataFrame
  giaiThich: DataFrame là bảng dữ liệu của pandas, mỗi cột có tên và có kiểu riêng, mỗi hàng có một nhãn. Giống một trang tính Excel nhưng điều khiển bằng code, nên lọc, gộp, tính toán trên hàng triệu dòng chỉ cần vài lệnh.
  hocKy: ai-engineer/ch04-pandas-va-matplotlib
- id: gia-tri-thieu
  ten: Giá trị thiếu
  tenTiengAnh: missing value
  giaiThich: Giá trị thiếu là ô không có dữ liệu, pandas ghi là NaN. Phần lớn mô hình không chạy được khi còn NaN, nên phải bỏ dòng đó hoặc điền một giá trị thay thế như trung vị của cột.
  hocKy: ai-engineer/ch04-pandas-va-matplotlib
- id: histogram
  ten: Histogram
  tenTiengAnh: histogram
  giaiThich: Histogram chia trục giá trị thành các khoảng bằng nhau rồi đếm có bao nhiêu điểm dữ liệu rơi vào mỗi khoảng, vẽ thành các cột. Nhìn vào là biết dữ liệu tập trung ở đâu, lệch về bên nào.
  hocKy: ai-engineer/ch04-pandas-va-matplotlib
- id: vector
  ten: Vector
  tenTiengAnh: vector
  giaiThich: Vector là một dãy số có thứ tự, vừa là một điểm vừa là một mũi tên từ gốc tọa độ tới điểm đó. Mỗi mẫu dữ liệu trong ML là một vector, mỗi đặc trưng là một tọa độ.
  hocKy: ai-engineer/ch05-dai-so-tuyen-tinh
- id: tich-vo-huong
  ten: Tích vô hướng
  tenTiengAnh: dot product
  giaiThich: Tích vô hướng của hai vector là nhân từng cặp tọa độ rồi cộng lại, ra một con số. Số đó lớn khi hai vector cùng hướng, bằng 0 khi chúng vuông góc. Mỗi nơ-ron tính một tích vô hướng giữa trọng số và đầu vào.
  hocKy: ai-engineer/ch05-dai-so-tuyen-tinh
- id: ma-tran
  ten: Ma trận
  tenTiengAnh: matrix
  giaiThich: Ma trận là bảng số chữ nhật. Nó vừa là cách lưu cả bộ dữ liệu, vừa là một phép biến đổi biến vector này thành vector khác khi đem nhân với nó.
  hocKy: ai-engineer/ch05-dai-so-tuyen-tinh
- id: sigmoid
  ten: Hàm sigmoid
  tenTiengAnh: sigmoid
  giaiThich: Hàm sigmoid ép mọi số thực vào khoảng 0 tới 1 theo một đường cong hình chữ S, nên kết quả đọc được như một xác suất. Đạo hàm của nó có dạng rất gọn là sigmoid nhân với một trừ sigmoid.
  hocKy: ai-engineer/ch06-giai-tich
- id: phan-phoi-chuan
  ten: Phân phối chuẩn
  tenTiengAnh: normal distribution
  giaiThich: Phân phối chuẩn là phân phối hình chuông, đối xứng quanh trung bình. Khoảng 68% giá trị nằm trong một độ lệch chuẩn quanh trung bình, 95% trong hai độ lệch chuẩn. Nhiều đại lượng tự nhiên và sai số đo đạc có dạng này.
  hocKy: ai-engineer/ch07-xac-suat-thong-ke
- id: ky-vong
  ten: Kỳ vọng
  tenTiengAnh: expected value
  giaiThich: Kỳ vọng là giá trị trung bình về lâu dài của một đại lượng ngẫu nhiên, tính bằng cách lấy mỗi giá trị nhân với xác suất của nó rồi cộng lại. Tung xúc xắc rất nhiều lần thì trung bình tiến về 3,5.
  hocKy: ai-engineer/ch07-xac-suat-thong-ke
- id: phuong-sai
  ten: Phương sai
  tenTiengAnh: variance
  giaiThich: Phương sai là trung bình của bình phương độ lệch so với kỳ vọng, đo dữ liệu tản ra rộng hay hẹp. Căn bậc hai của phương sai là độ lệch chuẩn, có cùng đơn vị với dữ liệu.
  hocKy: ai-engineer/ch07-xac-suat-thong-ke
- id: dinh-ly-bayes
  ten: Định lý Bayes
  tenTiengAnh: Bayes' theorem
  giaiThich: Định lý Bayes cho cách cập nhật niềm tin khi có bằng chứng mới. Xác suất của giả thuyết sau khi thấy bằng chứng tỷ lệ với xác suất ban đầu nhân với khả năng giả thuyết đó sinh ra bằng chứng.
  hocKy: ai-engineer/ch07-xac-suat-thong-ke
- id: sgd
  ten: SGD
  tenTiengAnh: stochastic gradient descent
  giaiThich: SGD tính gradient trên một mẫu hoặc một nhóm nhỏ mẫu thay vì cả bộ dữ liệu, rồi cập nhật ngay. Mỗi bước rẻ hơn rất nhiều nhưng ồn hơn, đường đi lắc lư quanh hướng đúng. Mọi mạng nơ-ron lớn đều huấn luyện theo cách này.
  hocKy: ai-engineer/ch08-toi-uu-hoa
- id: epoch
  ten: Epoch
  tenTiengAnh: epoch
  giaiThich: Một epoch là một lượt mô hình đi qua toàn bộ dữ liệu huấn luyện đúng một lần. Với lô 32 mẫu và 3200 mẫu dữ liệu, một epoch gồm 100 bước cập nhật.
  hocKy: ai-engineer/ch08-toi-uu-hoa
- id: momentum
  ten: Momentum
  tenTiengAnh: momentum
  giaiThich: Momentum cộng dồn các gradient cũ thành một vận tốc, như hòn bi lăn có quán tính. Các thành phần đổi dấu liên tục triệt tiêu nhau, thành phần cùng hướng thì cộng dồn, nên đi nhanh dọc thung lũng dài mà ít lắc qua lại.
  hocKy: ai-engineer/ch08-toi-uu-hoa
- id: adam
  ten: Adam
  tenTiengAnh: Adam
  giaiThich: Adam là thuật toán tối ưu kết hợp momentum với việc chia gradient cho độ lớn trung bình gần đây của chính nó, nên mỗi tham số có bước đi riêng. Đây là lựa chọn mặc định khi huấn luyện mạng nơ-ron.
  hocKy: ai-engineer/ch08-toi-uu-hoa
- id: tap-kiem-dinh
  ten: Tập validation
  tenTiengAnh: validation set
  giaiThich: Tập validation là phần dữ liệu tách riêng, không dùng để huấn luyện, dùng để so sánh các mô hình và chọn siêu tham số. Tập test được giữ kín tới cuối, chỉ đo đúng một lần để báo cáo kết quả.
  hocKy: ai-engineer/ch09-quy-trinh-du-an-ml
- id: baseline
  ten: Baseline
  tenTiengAnh: baseline
  giaiThich: Baseline là mô hình đơn giản nhất có thể, ví dụ luôn đoán giá trị trung bình. Mô hình thật phải tốt hơn baseline thì mới có ý nghĩa; không tốt hơn là dấu hiệu có lỗi.
  hocKy: ai-engineer/ch09-quy-trinh-du-an-ml
- id: ro-ri-du-lieu
  ten: Rò rỉ dữ liệu
  tenTiengAnh: data leakage
  giaiThich: Rò rỉ dữ liệu là khi thông tin mà lúc dùng thật mô hình không có được lại lọt vào lúc huấn luyện hay đánh giá. Kết quả đo được đẹp một cách giả tạo, rồi sụp đổ khi đưa vào sản xuất.
  hocKy: ai-engineer/ch09-quy-trinh-du-an-ml
- id: cross-validation
  ten: Cross-validation
  tenTiengAnh: cross-validation
  giaiThich: Cross-validation chia dữ liệu huấn luyện thành k phần, lần lượt lấy mỗi phần làm validation và huấn luyện trên phần còn lại, rồi lấy trung bình k kết quả. Cho con số ổn định hơn một lần chia duy nhất.
  hocKy: ai-engineer/ch09-quy-trinh-du-an-ml
- id: phan-loai
  ten: Phân loại
  tenTiengAnh: classification
  giaiThich: Phân loại là bài toán đoán mẫu thuộc nhóm nào trong một số nhóm cho trước, như đỗ hay trượt, thư rác hay không, ảnh mèo hay chó. Khác hồi quy là đoán ra một con số liên tục.
  hocKy: ai-engineer/ch11-hoi-quy-logistic
- id: cross-entropy
  ten: Cross-entropy
  tenTiengAnh: cross-entropy
  giaiThich: Cross-entropy là hàm mất mát cho bài toán phân loại, bằng trừ log của xác suất mô hình gán cho đáp án đúng. Đoán đúng mà tự tin thì phạt gần 0, đoán sai mà tự tin thì phạt rất nặng.
  hocKy: ai-engineer/ch11-hoi-quy-logistic
- id: ranh-gioi-quyet-dinh
  ten: Ranh giới quyết định
  tenTiengAnh: decision boundary
  giaiThich: Ranh giới quyết định là đường (hay mặt) chia không gian đặc trưng thành các vùng mà mô hình đoán khác nhau. Với hồi quy logistic, đó là nơi xác suất đúng bằng 0,5.
  hocKy: ai-engineer/ch11-hoi-quy-logistic
- id: softmax
  ten: Softmax
  tenTiengAnh: softmax
  giaiThich: Softmax biến một dãy điểm số bất kỳ thành một dãy xác suất dương cộng lại bằng 1, bằng cách lấy mũ từng số rồi chia cho tổng. Dùng ở lớp cuối của mọi mô hình phân loại nhiều lớp.
  hocKy: ai-engineer/ch11-hoi-quy-logistic
- id: ma-tran-nham-lan
  ten: Ma trận nhầm lẫn
  tenTiengAnh: confusion matrix
  giaiThich: Ma trận nhầm lẫn đếm bốn trường hợp của một bộ phân loại nhị phân - đoán dương đúng, đoán dương sai, đoán âm đúng, đoán âm sai. Mọi thước đo phân loại đều tính từ bốn con số này.
  hocKy: ai-engineer/ch12-danh-gia-mo-hinh
- id: precision
  ten: Precision
  tenTiengAnh: precision
  giaiThich: Precision là trong những lần mô hình báo dương tính, có bao nhiêu phần trăm là đúng. Precision thấp nghĩa là mô hình hay báo động nhầm.
  hocKy: ai-engineer/ch12-danh-gia-mo-hinh
- id: recall
  ten: Recall
  tenTiengAnh: recall
  giaiThich: Recall là trong những trường hợp thật sự dương tính, mô hình bắt được bao nhiêu phần trăm. Recall thấp nghĩa là mô hình hay bỏ sót.
  hocKy: ai-engineer/ch12-danh-gia-mo-hinh
- id: f1
  ten: F1
  tenTiengAnh: F1 score
  giaiThich: F1 là trung bình điều hòa của precision và recall, một con số duy nhất chỉ cao khi cả hai cùng cao. Một trong hai thấp là F1 bị kéo xuống.
  hocKy: ai-engineer/ch12-danh-gia-mo-hinh
- id: roc-auc
  ten: ROC AUC
  tenTiengAnh: ROC AUC
  giaiThich: ROC AUC là diện tích dưới đường ROC, bằng xác suất mô hình chấm một mẫu dương ngẫu nhiên cao điểm hơn một mẫu âm ngẫu nhiên. 0,5 là đoán bừa, 1 là xếp hạng hoàn hảo; không phụ thuộc vào ngưỡng.
  hocKy: ai-engineer/ch12-danh-gia-mo-hinh
- id: overfitting
  ten: Overfitting
  tenTiengAnh: overfitting
  giaiThich: Overfitting là khi mô hình học thuộc cả nhiễu của dữ liệu huấn luyện, nên lỗi trên train rất thấp mà lỗi trên dữ liệu mới lại cao. Như học sinh học vẹt đáp án, gặp đề mới là lúng túng.
  hocKy: ai-engineer/ch13-overfitting-regularization
- id: underfitting
  ten: Underfitting
  tenTiengAnh: underfitting
  giaiThich: Underfitting là khi mô hình quá đơn giản để nắm được quy luật thật, nên sai nhiều trên cả train lẫn dữ liệu mới. Như dùng một đường thẳng để mô tả một đường cong.
  hocKy: ai-engineer/ch13-overfitting-regularization
- id: bias-variance
  ten: Bias và variance
  tenTiengAnh: bias-variance tradeoff
  giaiThich: Lỗi của mô hình trên dữ liệu mới tách được thành ba phần - bias là lệch có hệ thống do mô hình quá đơn giản, variance là dao động theo từng bộ dữ liệu do mô hình quá linh hoạt, cộng nhiễu không tránh được. Giảm phần này thường làm tăng phần kia.
  hocKy: ai-engineer/ch13-overfitting-regularization
- id: regularization
  ten: Regularization
  tenTiengAnh: regularization
  giaiThich: Regularization là thêm vào hàm mất mát một khoản phạt cho trọng số lớn, để mô hình ưu tiên lời giải đơn giản hơn. Ridge phạt tổng bình phương trọng số, lasso phạt tổng trị tuyệt đối và có thể đẩy trọng số về đúng 0.
  hocKy: ai-engineer/ch13-overfitting-regularization
- id: knn
  ten: KNN
  tenTiengAnh: k-nearest neighbors
  giaiThich: KNN đoán nhãn của một mẫu mới bằng cách tìm k mẫu gần nó nhất trong dữ liệu huấn luyện rồi lấy nhãn chiếm đa số (hoặc trung bình, với hồi quy). Không học tham số nào, chỉ nhớ toàn bộ dữ liệu.
  hocKy: ai-engineer/ch14-knn
- id: khoang-cach-euclid
  ten: Khoảng cách Euclid
  tenTiengAnh: Euclidean distance
  giaiThich: Khoảng cách Euclid là độ dài đoạn thẳng nối hai điểm, tính bằng căn bậc hai của tổng bình phương hiệu từng tọa độ, như định lý Pythago mở rộng ra nhiều chiều.
  hocKy: ai-engineer/ch14-knn
- id: loi-nguyen-chieu
  ten: Lời nguyền số chiều
  tenTiengAnh: curse of dimensionality
  giaiThich: Khi số chiều tăng, các điểm dữ liệu trở nên xa nhau và xa đều nhau, điểm gần nhất cũng gần như xa bằng điểm xa nhất. Các phương pháp dựa trên khoảng cách như KNN mất dần tác dụng.
  hocKy: ai-engineer/ch14-knn
- id: naive-bayes
  ten: Naive Bayes
  tenTiengAnh: naive Bayes
  giaiThich: Naive Bayes là bộ phân loại dùng định lý Bayes với một giả định ngây thơ - các đặc trưng độc lập với nhau khi đã biết lớp. Nhờ giả định đó, xác suất của cả mẫu chỉ là tích xác suất của từng đặc trưng, học bằng cách đếm.
  hocKy: ai-engineer/ch15-naive-bayes
- id: laplace-smoothing
  ten: Làm trơn Laplace
  tenTiengAnh: Laplace smoothing
  giaiThich: Làm trơn Laplace cộng thêm 1 vào mọi số đếm trước khi tính xác suất, để một từ chưa từng gặp trong một lớp không làm xác suất của cả câu bằng đúng 0.
  hocKy: ai-engineer/ch15-naive-bayes
- id: svm
  ten: SVM
  tenTiengAnh: support vector machine
  giaiThich: SVM là bộ phân loại tìm đường ranh giới cách xa hai lớp nhất có thể, như con đường rộng nhất chạy giữa hai khu dân cư. Chỉ vài điểm sát ranh giới quyết định vị trí của nó.
  hocKy: ai-engineer/ch16-svm-kernel
- id: vector-ho-tro
  ten: Vector hỗ trợ
  tenTiengAnh: support vector
  giaiThich: Vector hỗ trợ là những điểm dữ liệu nằm trên hoặc lấn vào lề của SVM. Xóa mọi điểm khác đi, ranh giới vẫn y nguyên; chỉ những điểm này mới quan trọng.
  hocKy: ai-engineer/ch16-svm-kernel
- id: kernel
  ten: Kernel
  tenTiengAnh: kernel
  giaiThich: Kernel là hàm đo độ giống nhau giữa hai điểm, cho phép SVM làm việc như thể dữ liệu đã được đưa lên một không gian nhiều chiều hơn mà không cần tính tọa độ trong không gian đó. Nhờ vậy ranh giới thẳng trên đó thành ranh giới cong ở không gian gốc.
  hocKy: ai-engineer/ch16-svm-kernel
- id: cay-quyet-dinh
  ten: Cây quyết định
  tenTiengAnh: decision tree
  giaiThich: Cây quyết định là một chuỗi câu hỏi có hoặc không về các đặc trưng, ví dụ giờ học có nhỏ hơn 3,5 không. Mỗi câu trả lời dẫn xuống một nhánh, tới lá thì ra dự đoán. Đọc được bằng mắt như một sơ đồ.
  hocKy: ai-engineer/ch17-cay-quyet-dinh
- id: gini
  ten: Độ vẩn Gini
  tenTiengAnh: Gini impurity
  giaiThich: Độ vẩn Gini đo một nhóm mẫu lẫn lộn các lớp tới đâu, bằng xác suất đoán sai nếu gán nhãn ngẫu nhiên theo tỷ lệ các lớp trong nhóm. Bằng 0 khi cả nhóm cùng một lớp. Cây chọn câu hỏi làm Gini giảm nhiều nhất.
  hocKy: ai-engineer/ch17-cay-quyet-dinh
- id: ensemble
  ten: Ensemble
  tenTiengAnh: ensemble
  giaiThich: Ensemble là gộp dự đoán của nhiều mô hình thành một, bằng bỏ phiếu hoặc lấy trung bình. Nếu các mô hình sai theo những cách khác nhau, lỗi của chúng triệt tiêu một phần, như hỏi ý kiến nhiều người thay vì một người.
  hocKy: ai-engineer/ch18-ensemble
- id: random-forest
  ten: Random forest
  tenTiengAnh: random forest
  giaiThich: Random forest là nhiều cây quyết định, mỗi cây học trên một mẫu bootstrap của dữ liệu và chỉ được xét một phần ngẫu nhiên các đặc trưng ở mỗi nút. Các cây bỏ phiếu. Giảm mạnh variance của cây đơn lẻ.
  hocKy: ai-engineer/ch18-ensemble
- id: boosting
  ten: Boosting
  tenTiengAnh: boosting
  giaiThich: Boosting xây các mô hình nhỏ nối tiếp nhau, mỗi mô hình mới tập trung sửa phần mà các mô hình trước còn sai. Gradient boosting cho mỗi cây mới khớp phần dư của tổng các cây trước. Giảm bias của mô hình yếu.
  hocKy: ai-engineer/ch18-ensemble
- id: hoc-khong-giam-sat
  ten: Học không giám sát
  tenTiengAnh: unsupervised learning
  giaiThich: Học không giám sát là tìm cấu trúc trong dữ liệu không có nhãn, ví dụ nhóm những khách hàng giống nhau, mà không ai cho biết trước có những nhóm nào. Khác học có giám sát, nơi mỗi mẫu có sẵn đáp án.
  hocKy: ai-engineer/ch19-phan-cum
- id: k-means
  ten: K-means
  tenTiengAnh: k-means
  giaiThich: K-means chia dữ liệu thành k cụm bằng cách lặp hai bước - gán mỗi điểm vào tâm gần nhất, rồi dời mỗi tâm về trung bình các điểm của nó - cho tới khi không còn gì thay đổi.
  hocKy: ai-engineer/ch19-phan-cum
- id: silhouette
  ten: Hệ số silhouette
  tenTiengAnh: silhouette coefficient
  giaiThich: Hệ số silhouette của một điểm so khoảng cách trung bình tới các điểm cùng cụm với khoảng cách tới cụm gần nhất khác, cho một số từ -1 tới 1. Gần 1 là điểm nằm gọn trong cụm của nó, gần 0 là nằm giữa hai cụm.
  hocKy: ai-engineer/ch19-phan-cum
- id: dbscan
  ten: DBSCAN
  tenTiengAnh: DBSCAN
  giaiThich: DBSCAN gom các điểm nằm trong vùng dày đặc thành cụm, nối những điểm có đủ hàng xóm trong một bán kính cho trước. Tìm được cụm hình dạng bất kỳ và tự đánh dấu điểm nhiễu, không cần biết trước số cụm.
  hocKy: ai-engineer/ch19-phan-cum
- id: pca
  ten: PCA
  tenTiengAnh: principal component analysis
  giaiThich: PCA tìm những hướng mà dữ liệu trải rộng nhất, gọi là thành phần chính, rồi chiếu dữ liệu lên vài hướng đầu để giảm số chiều mà giữ lại nhiều thông tin nhất. Các hướng đó là vector riêng của ma trận hiệp phương sai.
  hocKy: ai-engineer/ch20-giam-chieu
- id: tsne
  ten: t-SNE
  tenTiengAnh: t-distributed stochastic neighbor embedding
  giaiThich: t-SNE đặt dữ liệu nhiều chiều xuống 2 hoặc 3 chiều sao cho những điểm gần nhau vẫn gần nhau, để nhìn bằng mắt. Giữ tốt hàng xóm gần nhưng không giữ khoảng cách xa, nên chỉ dùng để trực quan hóa.
  hocKy: ai-engineer/ch20-giam-chieu
- id: one-hot
  ten: Mã hóa one-hot
  tenTiengAnh: one-hot encoding
  giaiThich: Mã hóa one-hot biến một cột phân loại có k giá trị thành k cột 0 hoặc 1, mỗi cột ứng với một giá trị. Lớp L1 thành (1, 0), lớp L2 thành (0, 1). Tránh việc mô hình hiểu nhầm giữa các nhóm có thứ tự hay khoảng cách.
  hocKy: ai-engineer/ch21-feature-engineering
- id: permutation-importance
  ten: Permutation importance
  tenTiengAnh: permutation importance
  giaiThich: Permutation importance đo độ quan trọng của một đặc trưng bằng cách xáo trộn ngẫu nhiên cột đó trên dữ liệu test rồi xem điểm số của mô hình tụt bao nhiêu. Tụt nhiều là mô hình thật sự dựa vào đặc trưng đó.
  hocKy: ai-engineer/ch21-feature-engineering
- id: no-ron
  ten: Nơ-ron
  tenTiengAnh: neuron
  giaiThich: Một nơ-ron nhân tạo tính tổ hợp tuyến tính của đầu vào, w nhân x cộng b, rồi đưa qua một hàm kích hoạt phi tuyến. Đó là hồi quy tuyến tính hoặc logistic gói lại thành một viên gạch để xếp thành mạng.
  hocKy: ai-engineer/ch23-no-ron-mang-nhieu-lop
- id: ham-kich-hoat
  ten: Hàm kích hoạt
  tenTiengAnh: activation function
  giaiThich: Hàm kích hoạt là hàm phi tuyến áp lên đầu ra tuyến tính của mỗi nơ-ron, như sigmoid, tanh hay ReLU. Không có nó, xếp bao nhiêu lớp cũng chỉ bằng một phép biến đổi tuyến tính.
  hocKy: ai-engineer/ch23-no-ron-mang-nhieu-lop
- id: relu
  ten: ReLU
  tenTiengAnh: rectified linear unit
  giaiThich: ReLU giữ nguyên số dương và biến số âm thành 0, tức max(0, z). Đơn giản, tính nhanh, đạo hàm bằng 1 ở vùng dương nên không làm gradient co lại như sigmoid. Là hàm kích hoạt mặc định của mạng sâu.
  hocKy: ai-engineer/ch23-no-ron-mang-nhieu-lop
- id: mlp
  ten: Mạng nhiều lớp
  tenTiengAnh: multilayer perceptron
  giaiThich: Mạng nhiều lớp (MLP) xếp nhiều lớp nơ-ron nối tiếp, đầu ra của lớp này là đầu vào của lớp sau. Các lớp giữa gọi là lớp ẩn. Đủ nơ-ron thì xấp xỉ được gần như mọi hàm liên tục.
  hocKy: ai-engineer/ch23-no-ron-mang-nhieu-lop
- id: backpropagation
  ten: Lan truyền ngược
  tenTiengAnh: backpropagation
  giaiThich: Lan truyền ngược tính gradient của loss theo mọi tham số của mạng bằng cách áp quy tắc chuỗi từ lớp ra ngược về lớp vào, dùng lại các giá trị đã tính ở lượt xuôi. Chi phí chỉ cỡ hai lần truyền xuôi, dù mạng có bao nhiêu tham số.
  hocKy: ai-engineer/ch24-backpropagation
- id: do-thi-tinh-toan
  ten: Đồ thị tính toán
  tenTiengAnh: computational graph
  giaiThich: Đồ thị tính toán vẽ một phép tính lớn thành chuỗi các phép tính nhỏ nối với nhau, mỗi nút là một phép tính. Đi xuôi để ra kết quả, đi ngược để tính đạo hàm từng nút bằng quy tắc chuỗi.
  hocKy: ai-engineer/ch24-backpropagation
- id: tensor
  ten: Tensor
  tenTiengAnh: tensor
  giaiThich: Tensor là mảng nhiều chiều của PyTorch, giống mảng NumPy nhưng chạy được trên GPU và ghi nhớ các phép tính đã làm để tự tính gradient. Vô hướng, vector, ma trận đều là tensor với số chiều 0, 1, 2.
  hocKy: ai-engineer/ch25-pytorch-can-ban
- id: autograd
  ten: Autograd
  tenTiengAnh: automatic differentiation
  giaiThich: Autograd là cơ chế PyTorch ghi lại đồ thị tính toán trong lượt xuôi rồi tự chạy lan truyền ngược khi gọi backward. Người dùng chỉ viết lượt xuôi, gradient của mọi tham số được tính tự động.
  hocKy: ai-engineer/ch25-pytorch-can-ban
- id: gradient-bien-mat
  ten: Gradient biến mất
  tenTiengAnh: vanishing gradient
  giaiThich: Gradient biến mất là hiện tượng gradient co lại theo cấp số nhân khi lan ngược qua nhiều lớp, vì nó là tích của nhiều số nhỏ hơn 1. Các lớp đầu gần như không được cập nhật nên mạng sâu không học được.
  hocKy: ai-engineer/ch26-huan-luyen-mang-sau
- id: batch-norm
  ten: Batch normalization
  tenTiengAnh: batch normalization
  giaiThich: Batch normalization chuẩn hóa đầu ra của một lớp về trung bình 0, độ lệch chuẩn 1 theo từng lô, rồi nhân và cộng hai tham số học được. Nó giữ tín hiệu ở thang đo ổn định qua các lớp, giúp mạng sâu học nhanh và ít phụ thuộc khởi tạo.
  hocKy: ai-engineer/ch26-huan-luyen-mang-sau
- id: dropout
  ten: Dropout
  tenTiengAnh: dropout
  giaiThich: Dropout tắt ngẫu nhiên một tỷ lệ nơ-ron ở mỗi bước huấn luyện, buộc mạng không dựa vào một vài nơ-ron riêng lẻ. Lúc đánh giá thì tắt dropout. Đây là một cách chống overfitting.
  hocKy: ai-engineer/ch26-huan-luyen-mang-sau
- id: tich-chap
  ten: Tích chập
  tenTiengAnh: convolution
  giaiThich: Tích chập trượt một bộ lọc nhỏ (ví dụ 3 nhân 3) qua mọi vị trí của ảnh, ở mỗi vị trí nhân từng ô rồi cộng lại thành một số. Cùng một bộ lọc dùng chung cho mọi vị trí, nên nó phát hiện cùng một mẫu (cạnh, góc) ở bất kỳ đâu trong ảnh.
  hocKy: ai-engineer/ch27-cnn
- id: pooling
  ten: Pooling
  tenTiengAnh: pooling
  giaiThich: Pooling thu nhỏ bản đồ đặc trưng bằng cách gộp mỗi ô nhỏ (thường 2 nhân 2) thành một số, ví dụ lấy số lớn nhất. Nó giảm số phép tính và làm mạng ít nhạy với dịch chuyển nhỏ.
  hocKy: ai-engineer/ch27-cnn
- id: cnn
  ten: CNN
  tenTiengAnh: convolutional neural network
  giaiThich: CNN là mạng nơ-ron dùng các lớp tích chập và pooling để xử lý dữ liệu dạng lưới như ảnh. Lớp đầu học các mẫu đơn giản như cạnh, lớp sau ghép chúng thành mẫu phức tạp hơn, với ít tham số hơn nhiều so với lớp dày đặc.
  hocKy: ai-engineer/ch27-cnn
