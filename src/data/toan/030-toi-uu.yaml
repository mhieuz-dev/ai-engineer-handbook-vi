so: 30
ten: Gradient descent hàm bậc hai
module: toi-uu
loai: code
muc: de
de: Viết `gd(A,b,x0,lr,steps)` chạy gradient descent cho `f(x)=1/2 x^T A x - b^T x`, trả về x sau `steps`
  bước.
goi_y:
- Gradient là Ax-b.
- Cập nhật x = x - lr*(Ax-b).
- Lặp steps lần.
loi_giai: "import numpy as np\n\ndef gd(A, b, x0, lr, steps):\n    x = np.asarray(x0, dtype=float).copy()\n\
  \    A = np.asarray(A, dtype=float)\n    b = np.asarray(b, dtype=float)\n    for _ in range(steps):\n\
  \        x = x - lr * (A @ x - b)\n    return x"
lien_quan: []
chung_minh: Gradient của 1/2 x^T A x - b^T x là Ax-b; hội tụ nếu 0<lr<2/λ_max(A).
phuc_tap: O(steps·d²).
khung: "import numpy as np\n\ndef gd(A, b, x0, lr, steps):\n    # viết code ở đây\n    pass"
test_vi_du: 'import numpy as np

  A = np.array([[2., 0.], [0., 2.]])

  b = np.array([2., 4.])

  x = gd(A, b, np.zeros(2), 0.1, 100)

  assert np.allclose(x, [1., 2.], atol=1e-6)

  print("OK")'
test_an: 'import numpy as np

  A = np.array([[4., 1.], [1., 3.]])

  b = np.array([1., 2.])

  x = gd(A, b, np.zeros(2), 0.1, 500)

  assert np.allclose(A @ x, b, atol=1e-6)

  print("OK")'
