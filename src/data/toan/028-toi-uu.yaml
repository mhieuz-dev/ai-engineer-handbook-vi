de: Chứng minh gradient mini-batch là ước lượng không lệch của gradient đầy đủ khi lấy mẫu đều.
goi_y:
- Kỳ vọng của trung bình mẫu.
- Tuyến tính của kỳ vọng.
- Mỗi chỉ số được chọn với xác suất 1/n.
loi_giai: E[1/|B| Σ_{i∈B} ∇f_i] = 1/|B| Σ E[∇f_i] = 1/n Σ ∇f_i = ∇f.
